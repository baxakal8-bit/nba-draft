<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NBA Player Comparison</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>NBA Player Comparison</h1>

    <p id="status">Loading data...</p>

    <div id="pickers" hidden>
      <div class="picker">
        <div id="name-a"></div>
        <div id="season-a"></div>
      </div>
      <div class="vs">vs</div>
      <div class="picker">
        <div id="name-b"></div>
        <div id="season-b"></div>
      </div>
    </div>

    <table id="compare" hidden>
      <thead>
        <tr>
          <th id="head-a">—</th>
          <th class="stat-name">Stat</th>
          <th id="head-b">—</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>

    <p id="note" hidden></p>

    <script src="score.js"></script>
    <script src="data.js"></script>
    <script src="photo.js"></script>
    <script src="dropdown.js"></script>
    <script src="main.js"></script>
  </body>
</html>
