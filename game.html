<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Draft</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="game.css" />
  </head>
  <body>
    <div id="top">
      <h1>Draft</h1>
      <div id="reveal">
        <button type="button" class="reveal-option is-on" data-show="no">
          Scores hidden <span class="hint">recommended</span>
        </button>
        <button type="button" class="reveal-option" data-show="yes">Scores shown</button>
      </div>
    </div>

    <p id="status">Loading data...</p>

    <div id="game" hidden>
      <div id="bar">
        <div class="meter">
          <span class="meter-label">Cap space</span>
          <span class="meter-value" id="budget">$100M</span>
        </div>
        <div class="meter">
          <span class="meter-label">Round</span>
          <span class="meter-value" id="round">1 / 5</span>
        </div>
        <div class="meter">
          <span class="meter-label">Score</span>
          <span class="meter-value" id="total">0</span>
        </div>
        <div class="meter">
          <span class="meter-label">Best</span>
          <span class="meter-value" id="best">—</span>
        </div>
      </div>

      <div id="roster"></div>

      <div id="deck-head">
        <h2 id="deck-title">Pick one</h2>
        <div id="lifelines">
          <span id="lifeline-label">Lifelines<span class="lifeline-hint">one use each</span></span>
          <button type="button" class="lifeline" data-use="shuffle">
            Shuffle<span class="lifeline-hint">a new board</span>
          </button>
          <button type="button" class="lifeline" data-use="reveal">
            Reveal<span class="lifeline-hint">scores on this board</span>
          </button>
          <button type="button" class="lifeline" data-use="double">
            Double dip<span class="lifeline-hint">two from this board</span>
          </button>
          <button type="button" class="lifeline" data-use="years">
            Other years<span class="lifeline-hint">same names, new seasons</span>
          </button>
          <button type="button" class="lifeline" data-use="sell">
            Sell<span class="lifeline-hint">refund one of yours</span>
          </button>
        </div>
      </div>
      <div id="deck"></div>

      <div id="finish" hidden>
        <p id="verdict"></p>
        <button id="again" type="button">Play again</button>
      </div>
    </div>

    <script src="score.js"></script>
    <script src="records.js"></script>
    <script src="data.js"></script>
    <script src="game.js"></script>
  </body>
</html>
