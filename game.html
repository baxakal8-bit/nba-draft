<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Draft</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="game.css" />
  </head>
  <body>
    <div id="top">
      <h1>Draft</h1>
      <div id="reveal">
        <button type="button" class="reveal-option is-on" data-show="no">
          Scores hidden <span class="hint">recommended</span>
        </button>
        <button type="button" class="reveal-option" data-show="yes">Scores shown</button>
      </div>
    </div>

    <p id="status">Loading data...</p>

    <div id="game" hidden>
      <div id="bar">
        <div class="meter">
          <span class="meter-label">Budget</span>
          <span class="meter-value" id="budget">100</span>
        </div>
        <div class="meter">
          <span class="meter-label">Round</span>
          <span class="meter-value" id="round">1 / 5</span>
        </div>
        <div class="meter">
          <span class="meter-label">Score</span>
          <span class="meter-value" id="total">0</span>
        </div>
      </div>

      <div id="roster"></div>

      <h2 id="deck-title">Pick one</h2>
      <div id="deck"></div>

      <div id="finish" hidden>
        <p id="verdict"></p>
        <button id="again" type="button">Play again</button>
      </div>
    </div>

    <script src="score.js"></script>
    <script src="data.js"></script>
    <script src="game.js"></script>
  </body>
</html>
